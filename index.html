<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAYRA Marketplace V4</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#15171a}.wrap{max-width:1050px;margin:auto;background:#fff;min-height:100vh}.top{padding:20px 24px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between}.brand{font-size:29px;font-weight:900}.muted{color:#73777e;font-size:13px}.nav{display:flex;gap:7px;padding:12px 20px;border-bottom:1px solid #eee;overflow:auto}.nav button,.btn{border:1px solid #ddd;background:#fff;border-radius:9px;padding:9px 12px;cursor:pointer;white-space:nowrap}.dark{background:#111;color:#fff;border-color:#111}.main{padding:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}.card{border:1px solid #e0e2e5;border-radius:14px;padding:15px;margin:12px 0}.pic{height:125px;border-radius:12px;background:#e9ebee;display:flex;align-items:center;justify-content:center;font-size:46px}.price{font-weight:900;font-size:19px;margin-top:6px}.input{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px;margin:5px 0 10px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.tag{font-size:11px;padding:5px 8px;border-radius:7px;background:#f0f1f3}.hidden{display:none}.hero{padding:22px;border-radius:17px;background:#111;color:#fff}.hero h1{margin:0}.login{max-width:400px;margin:80px auto;padding:25px;border:1px solid #ddd;border-radius:16px}
</style></head><body><div id="login" class="login"><div class="brand">FAYRA</div><div class="muted">Marketplace V4</div><h2>Login</h2><input id="email" class="input" placeholder="Email"><input id="pass" type="password" class="input" placeholder="Password"><button class="btn dark" onclick="login()">Masuk</button><p class="muted">Seller demo: seller@fayra.local / seller123</p></div>
<div id="app" class="wrap hidden"><div class="top"><div><div class="brand">FAYRA</div><div class="muted">Marketplace • Seller Center V4</div></div><button class="btn" onclick="logout()">Keluar</button></div><div class="nav"><button onclick="market()">🛍 Marketplace</button><button onclick="myOrders()">📦 Pesanan</button><button id="sellerNav" onclick="sellerHome()">🏪 Seller Center</button></div><main id="main" class="main"></main></div>
<script>
let me=null;
const money=n=>"Rp"+Number(n).toLocaleString("id-ID");
async function api(url,opt={}){opt.headers=Object.assign({"Content-Type":"application/json","x-user-id":me?.id||""},opt.headers||{});let r=await fetch(url,opt),j=await r.json();if(!r.ok)throw Error(j.error||"Error");return j}
async function login(){try{me=await api("/api/auth/login",{method:"POST",body:JSON.stringify({email:email.value,password:pass.value})});document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");document.getElementById("sellerNav").classList.toggle("hidden",me.role!=="seller");market()}catch(e){alert(e.message)}}
async function market(){let ps=await api("/api/products");main.innerHTML=`<div class="hero"><h1>FAYRA Marketplace</h1><p>Produk dari seller tampil di sini.</p></div><h2>Produk</h2><div class="grid">${ps.map(p=>`<div class="card"><div class="pic">${p.image||"📦"}</div><b>${p.name}</b><div class="price">${money(p.price)}</div><div class="muted">${p.store_name} ${p.verified?"✓":""} • ${p.city}<br>Stok ${p.stock}</div>${me.role==="buyer"?`<button class="btn dark" onclick="buy(${p.id})">Beli COD</button>`:""}</div>`).join("")}</div>`}
async function buy(id){try{let j=await api("/api/orders",{method:"POST",body:JSON.stringify({items:[{product_id:id,qty:1}],payment_method:"COD"})});alert("Order #FYR-"+String(j.order_id).padStart(6,"0")+" dibuat");myOrders()}catch(e){alert(e.message)}}
async function myOrders(){let a=await api("/api/orders");main.innerHTML="<h2>Pesanan Saya</h2>"+(a.length?a.map(o=>`<div class='card'><div class='row'><b>#FYR-${String(o.id).padStart(6,"0")}</b><span class='tag'>${o.status}</span></div><p>${money(o.total)}</p><span class='muted'>${o.payment_method}</span></div>`).join(""):"<p class='muted'>Belum ada pesanan.</p>")}
async function sellerHome(){if(me.role!=="seller")return;let st=await api("/api/store/me"),ps=await api("/api/seller/products"),os=await api("/api/seller/orders"),w=await api("/api/seller/wallet");main.innerHTML=`<div class="hero"><h1>${st.name}</h1><p>${st.city} • ${st.verified?"✓ Terverifikasi":"Menunggu verifikasi"}</p></div><div class="grid"><div class="card"><span class="muted">Saldo</span><h2>${money(w.balance)}</h2></div><div class="card"><span class="muted">Pending</span><h2>${money(w.pending)}</h2></div><div class="card"><span class="muted">Produk</span><h2>${ps.length}</h2></div><div class="card"><span class="muted">Order</span><h2>${os.length}</h2></div></div><div class="card"><h3>Edit Toko</h3><input id="sn" class="input" value="${st.name}"><input id="sc" class="input" value="${st.city}"><input id="sd" class="input" value="${st.description||""}" placeholder="Deskripsi toko"><button class="btn dark" onclick="saveStore()">Simpan</button></div><div class="card"><h3>Tambah Produk</h3><input id="pn" class="input" placeholder="Nama produk"><input id="pp" class="input" type="number" placeholder="Harga"><input id="pst" class="input" type="number" placeholder="Stok"><input id="pc" class="input" placeholder="Kategori"><input id="pi" class="input" placeholder="Emoji/foto placeholder, mis. 📱"><input id="pd" class="input" placeholder="Deskripsi"><button class="btn dark" onclick="addProduct()">Terbitkan</button></div><h3>Produk Saya</h3>${ps.map(p=>`<div class="card"><div class="row"><b>${p.name}</b><span>${money(p.price)}</span></div><span class="muted">Stok ${p.stock} • ${p.category}</span><br><button class="btn" onclick="delProduct(${p.id})">Nonaktifkan</button></div>`).join("")}<h3>Order Masuk</h3>${os.map(o=>`<div class="card"><div class="row"><b>#FYR-${String(o.id).padStart(6,"0")}</b><span class="tag">${o.status}</span></div><p>${o.buyer} • ${money(o.total)}</p><button class="btn" onclick="status(${o.id},'PROCESSING')">Proses</button> <button class="btn" onclick="status(${o.id},'SHIPPED')">Kirim</button> <button class="btn" onclick="status(${o.id},'COMPLETED')">Selesai</button></div>`).join("")}`}
async function saveStore(){await api("/api/store/me",{method:"PATCH",body:JSON.stringify({name:sn.value,city:sc.value,description:sd.value})});alert("Toko diperbarui");sellerHome()}
async function addProduct(){try{await api("/api/seller/products",{method:"POST",body:JSON.stringify({name:pn.value,price:pp.value,stock:pst.value,category:pc.value,image:pi.value||"📦",description:pd.value})});alert("Produk diterbitkan");sellerHome()}catch(e){alert(e.message)}}
async function delProduct(id){await api("/api/seller/products/"+id,{method:"DELETE"});sellerHome()}
async function status(id,s){await api("/api/seller/orders/"+id+"/status",{method:"PATCH",body:JSON.stringify({status:s})});sellerHome()}
function logout(){location.reload()}
</script></body></html>
